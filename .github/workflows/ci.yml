name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push cancels an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, test & security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history, not just the tip commit

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci refuses to run if package.json and npm-shrinkwrap.json have
      # drifted apart, so this step alone is a deterministic lockfile check.
      - name: Install (from shrinkwrap, exact versions only)
        run: npm ci

      - name: Lockfile integrity (hosts, resolved URLs, https)
        run: npm run lockfile:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Dependency vulnerability audit (high/critical)
        run: npm run audit

      - name: Verify npm registry signatures & attestations
        run: npm audit signatures

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
